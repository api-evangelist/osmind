name: Osmind
description: >-
  Osmind is an interventional psychiatry platform that powers what it describes as the largest
  network of interventional psychiatry practices in the United States. The company provides a
  purpose-built electronic health record (EHR), billing and revenue-cycle management (RCM),
  measurement-based care and outcomes tracking, and a patient mobile app for practices delivering
  treatments such as ketamine, Spravato (esketamine), TMS, and other novel and interventional
  mental-health therapies. Osmind reports serving 1,000+ practices and supporting more than one
  million treatments delivered. It is a private B2B healthcare SaaS company backed by General
  Catalyst and other investors. As of this profile, Osmind publishes no public developer API,
  developer portal, API reference, SDKs, or webhook surface on its public site.
